[metadata]
name = electronicspy
version = 0.1.0
author = Diego Chumpitaz Palomino
author_email = diegoruben3124@gmail.com
description = A curated collection of electronics, customer sales, and financial market datasets sourced from Kaggle for data analysis, statistical modeling, machine learning research, and more, including electronics product data, customer purchase behavior and demographics, sales transactions, product types, and historical stock prices for Samsung Electronics.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/diegoruben3124-afk/electronicspy
project_urls =
    Bug Tracker = https://github.com/diegoruben3124-afk/electronicspy/issues
    Documentation = https://github.com/diegoruben3124-afk/electronicspy
    Source Code = https://github.com/diegoruben3124-afk/electronicspy
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Intended Audience :: Education
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Information Analysis
    Topic :: Software Development :: Libraries :: Python Modules
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.14
    Operating System :: OS Independent
    Natural Language :: English
keywords = electronics, electronic products, datasets, sales, customer behavior, purchase behavior, consumer data, customer demographics, transactions, product types, retail, e-commerce, sales analysis, financial data, stock prices, stock market, Samsung Electronics, historical stock data, financial analysis, stock forecasting, trend analysis, data science, statistics, machine learning, data analysis, research

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas>=1.5
include_package_data = True
zip_safe = False

[options.packages.find]
exclude =
    tests*
    docs*
    examples*

[options.package_data]
electronicspy = data/*.csv

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov
    black
    flake8
    mypy
docs =
    mkdocs
    mkdocs-material

# Configuration for pytest
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=electronicspy
    --cov-report=html
    --cov-report=term

# Configuration for coverage
[coverage:run]
source = electronicspy
omit =
    */tests/*
    */test_*.py
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

# Configuration for flake8
[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    env,
    venv

# Configuration for mypy
[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False